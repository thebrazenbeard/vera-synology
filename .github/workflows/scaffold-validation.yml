name: Scaffold validation

on:
  push:
    branches:
      - feature/mesh-first-install-spk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event SHA
        shell: bash
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run deterministic scaffold validation
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print(sys.version)
          PY
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q payload tools tests
          for f in spk/scripts/*; do sh -n "$f"; done
          python3 tools/build_spk.py
          python3 tools/verify_spk.py dist/VeraMesh-0.0.1-0002-reconstructed-scaffold.spk --manifest SOURCE_MANIFEST.json
      - name: Upload verified SPK
        uses: actions/upload-artifact@v4
        with:
          name: veramesh-spk-${{ github.sha }}
          path: work/dist/VeraMesh-0.0.1-0002-reconstructed-scaffold.spk
          if-no-files-found: error
          compression-level: 0
